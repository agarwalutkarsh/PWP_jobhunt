# jobhunt configuration. Everything tunable lives here — no editing Python.
#
# Tuned for: React / Next.js frontend, ~4 years experience (Utkarsh Agarwal).
#
# Tune `filters` first. It is deterministic, free, and it is what keeps the
# LLM bill small: roughly 2000 raw postings -> 40 candidates before a single
# token is spent.

filters:
  # Title regexes, matched case-insensitively against the job title only.
  # A title must match at least one include AND zero excludes.
  #
  # Gotcha: "sde" as a bare regex does NOT match "Software Development
  # Engineer" — different words entirely. Use \bsde\b for the acronym and
  # list the spelled-out variants separately, as below.
  include_titles:
    # --- core frontend track -------------------------------------------
    - '\b(frontend|front-end|front end)\b.*\b(engineer|developer|dev)\b'
    - '\b(engineer|developer)\b.*\b(frontend|front-end|front end)\b'
    - '\bui\s+(engineer|developer)\b'
    - '\bui\s*/\s*ux\s+(engineer|developer)\b'
    - '\bweb\s+(engineer|developer)\b'
    - '\bclient[\s-]side\s+(engineer|developer)\b'

    # --- framework / language named in the title ------------------------
    # Boards very often title these "React Developer" with no "frontend"
    # anywhere, so these earn their place.
    - '\b(react|react\.?js|reactjs)\b'
    - '\b(next\.?js|nextjs)\b'
    - '\b(javascript|typescript)\s+(engineer|developer)\b'
    - '\b(engineer|developer)\b.*\b(javascript|typescript)\b'
    - '\bmern\b'

    # --- full stack -----------------------------------------------------
    # Kept as a volume play, not a depth claim. A large share of Indian
    # "full stack" postings are React-heavy with light Node, and the
    # screener will downrank the ones that are genuinely backend-weighted
    # once profile.json says frontend-only. Delete this block if you get
    # tired of backend-heavy JDs in the digest.
    - '\bfull[\s-]?stack\b'
    - '\b(engineer|developer)\b.*\bfull[\s-]?stack\b'

    # --- generic software titles ----------------------------------------
    # Widest net, and the main cost driver: a lot of "Software Engineer"
    # postings turn out to be backend and only die at the screening call.
    # Comment this block out if the LLM bill climbs or the digest fills
    # with backend roles.
    - 'software engineer'
    - 'software development engineer'
    - '\bsde\b'
    - '\bsde\s*-?\s*(i{1,3}|[123])\b'
    - 'member of technical staff'
    - '\bproduct engineer\b'

  # Anything matching these is dropped even if an include matched.
  exclude_titles:
    - '\b(staff|principal|distinguished|fellow|architect)\b'      # too senior for now
    # "Senior" is left IN deliberately — at 4 years with production React,
    # Next.js and microfrontend work, "Senior Frontend Engineer" is a real
    # target rather than a stretch. Add '\bsenior\b' back here if the
    # screener keeps handing those 3s and 4s.
    # 'lead' / 'tech lead' left IN deliberately, at your call. "Lead Frontend
    # Engineer" at 4 years is a stretch-apply, so expect some 4s and 5s from
    # the screener. Add '\b(lead|team lead|tech lead)\b' here to kill them.
    - '\b(director|vp|vice president|head of|chief|cto)\b'
    - '\b(manager|management)\b'
    - '\b(intern|internship|apprentice|trainee|fresher)\b'        # too junior
    - '\b(sales|account executive|marketing|recruit|support|success)\b'

    # wrong discipline — this is the block that flipped from the original.
    # Frontend is now the target, so backend-only and low-level systems
    # postings are what get dropped.
    - '\b(backend|back-end|server-side)\b'
    - '\b(ios|android|mobile|flutter|react native|game|unity)\b'
    - '\b(ux|visual|graphic|product)\s+designer\b'
    - '\bdesigner\b'
    - '\b(devops|sre|site reliability|platform|infrastructure|infra)\b'
    - '\b(kernel|embedded|firmware|driver|packet|dataplane|data plane)\b'
    - '\b(data engineer|data scientist|machine learning|ml engineer|research scientist)\b'
    - '\b(qa|sdet|test|automation)\s+(engineer|analyst)\b'
    - '\b(salesforce|sharepoint|wordpress|drupal|sitecore|magento|shopify)\b'
    - '\b(\.net|dotnet|java|php|python|ruby|golang|go)\s+(developer|engineer)\b'

  # Substrings matched against "<location> <title>", case-insensitive.
  # Leave empty to accept every location.
  locations:
    - bangalore
    - bengaluru
    - hyderabad
    - pune
    - gurugram
    - gurgaon
    - noida
    - delhi
    - ncr
    - kolkata
    - india

  # If true, anything reading as remote passes the location gate.
  allow_remote: true

  # Drop postings older than this. Set to null to disable.
  # Boards often re-stamp `updated_at`, so this is a soft signal, not a promise.
  max_age_days: 30

# --- LLM stages -------------------------------------------------------------
screen_batch_size: 8      # jobs per screening call. Higher = cheaper, sloppier.
screen_jd_chars: 1400     # JD truncation for screening
draft_jd_chars: 6000      # JD truncation for drafting
score_threshold: 7.0      # below this, no draft and no digest slot
max_per_digest: 5         # hard cap on expensive draft calls per run

# --- paths ------------------------------------------------------------------
companies_file: companies.yaml
profile_file: profile.json
seen_file: seen.json
digest_file: out/digest.html
tracker_csv: out/tracker.csv